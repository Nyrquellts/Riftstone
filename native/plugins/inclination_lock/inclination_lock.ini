; inclination_lock settings. Keep this file next to inclination_lock.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\inclination_lock.log shows what it did.
[lock]
; freeze    Your main pawn's inclinations never drift. Elixirs and the Pawn Guild still change them,
;           so set the pawn up the way you want first.
; commands  Only the pawn orders stop moving inclinations: Go! (Guardian -4, Pioneer +20),
;           Help! (Guardian +2.67, Medicant +2) and Come! (Guardian +4). Everything else the pawn
;           sees and does changes them as in the unmodded game.
; off       The plugin loads and changes nothing.
Mode = freeze
