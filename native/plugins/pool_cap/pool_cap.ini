; pool_cap -- the sizes of the game's memory pools, in MiB.
; Dark Arisen takes eight pools once, at start-up, and never grows them: a request a full pool cannot place is
; refused. "unit" holds every enemy, player, model, rigid body, ragdoll and AI object (the game's 64 MiB);
; a ragdoll takes its body arrays from it, and a refusal leaves the ragdoll with no body (seen with 62 enemies
; at once: whether this pool was full then is UNKNOWN; the log below will say).
; Each value must lie between the game's own size and the most shown; all eight together at most 1280.
; The memory is the game's address space (4096 MB), taken once at start-up. A pool the PC cannot give its
; size is made at the game's own instead. riftstone\logs\pool_cap.log says what each pool refused.
[pool_cap]
; 64..1024
unit = 256
; 12..256 (nPhysics)
physics = 48
; 24..512 (collision shapes)
collision = 96
; 5..128
effect = 20
; 6..128 (the engine's arrays and strings)
array_string = 24
; 5..64
gui = 5
; 64..256 (short-lived work)
temp = 64
; 64..256
system = 64
