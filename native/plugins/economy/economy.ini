; economy settings. Keep this file next to economy.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\economy.log shows what it did.
; Every value is a multiplier: 1.0 leaves that part as the game has it, and all 1.0 patches nothing.
[shops]
; What every item costs in a shop, times this (0.1 to 5.0).
Buy = 1.0
; What a shop pays for every item, times this (0.1 to 5.0). Selling never pays more than buying costs
; where the game's own prices kept it so.
Sell = 1.25
[gold]
; The gold a quest gives, times this (0.1 to 10.0).
Quests = 1.5
; Gold found: a coin purse, and gold a hit gives, times this (0.1 to 10.0).
Found = 1.5
[crystals]
; The Rift Crystals a quest gives, times this (0.1 to 10.0).
Quests = 1.5
; A Rift Crystal item's crystals, times this (0.1 to 10.0).
Found = 1.5
[drops]
; The chance each roll of an enemy's drop gives an item, times this (0.1 to 5.0; at most every roll).
; The items keep their shares of that chance; an item that could drop keeps at least 1 roll in 100
; while the chance has room for every item.
Enemies = 1.5
; The same for a gathering spot (0.1 to 5.0).
Gathering = 1.25
