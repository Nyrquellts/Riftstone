; vocation_stats settings. Keep this file next to vocation_stats.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\vocation_stats.log shows what it did.
[vocation_stats]
; current = every rest at an inn gives a character the stats its current vocation would have given it
;           at every level it has (as if it had gained all of them in that vocation). Your level and
;           experience stay.
; off     = nothing is patched; the stats grow by whichever vocation you level in, as in the game.
Mode = current
; Who is recalculated: party (the Arisen and the main pawn), arisen or pawn. Hired pawns never are.
Who = party
