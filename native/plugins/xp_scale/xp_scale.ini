; xp_scale settings. Keep this file next to xp_scale.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\xp_scale.log shows what it did.
[xp]
; Experience from a kill, times this (0.1 to 2.0). The party shares it as the game does: the main pawn
; and your discipline follow, and hired pawns' Rift Crystals from it too.
Kills = 1.5
; Experience a quest gives, times this (0.1 to 2.0).
Quests = 1.5
[curve]
; A flatter level curve. While your next level costs more than this much experience, every reward is
; multiplied so that level takes no more than a level costing LevelCost would. 0 = the game's curve.
; The game's own costs: 4640 at level 10, 80100 at 50, 124100 at 100, 289100 at 150, 504700 at 199.
; 125000 keeps every level past 100 at about level 100's cost. 1000 to 10000000.
LevelCost = 125000
