; enemy_cap -- how many enemies the world can have active at once.
; The game's own limit is 10; enemies beyond the limit wait (nearest first) until a slot frees.
; 10..64.  More enemies cost CPU for their AI and animation; 30 is a comfortable default.
[enemy_cap]
slots = 30
; 1: riftstone\logs\enemy_cap.log records how many slots were in use (new peaks, when all were taken,
; a status line a minute, and the last reading when the game exits), so a session that ends badly
; says how full the pool was.  Reads only.  0: off.
record = 1
