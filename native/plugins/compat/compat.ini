; compat -- Dragon's Dogma Online skills in Dark Arisen (a Riftstone plugin).
; The skill programs are in compat.skills next to this file; `riftstone compat pack` writes them with
; the files they need.
[compat]
; 0 turns the plugin off without removing it.
enabled=1
skills=compat.skills
; 1 writes every action the game asks for to riftstone\logs\compat.log (to see what a button does).
trace=0

[slots]
; The program that replaces the skill equipped in each slot: main weapon slots 1-3, sub weapon slots
; 1-3. Empty keeps the Dark Arisen skill.
main1=alma_wave
main2=
main3=
sub1=
sub2=
sub3=

[levels]
; The Online skill level (1-10) a program runs at, by the level of the Dark Arisen skill it replaces.
unlearned=5
learned=5
level2=8
level3=10

[test]
; A key that starts a program while standing, walking or running, as a virtual-key code (0x76 = F7).
; 0 = off.
key=0
skill=alma_wave
level=10
