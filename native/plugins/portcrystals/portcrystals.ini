; portcrystals -- how many Portcrystals you can have placed in the world at once.
; The game's own limit is 10.  10..32.  Your save keeps the first ten as always; the ones past ten are kept in
; riftstone\portcrystals.bin beside it and come back when you load that save.  Without the plugin (or with a
; smaller number) the crystals past the limit are not in the game: pick them up first if you lower it.
[portcrystals]
slots = 15
