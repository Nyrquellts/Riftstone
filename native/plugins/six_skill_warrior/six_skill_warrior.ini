; six_skill_warrior settings. Keep this file next to six_skill_warrior.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\six_skill_warrior.log shows what it did.
[warrior]
; six  A Warrior in your party (you or a pawn) gets six skill slots, the way a Mage's staff has six:
;      the skill menu shows two rows of three for the longsword and warhammer, the first row fires
;      with the main-weapon skill button and the second with the secondary-weapon skill button.
;      The save already has room for six per weapon, so nothing in it grows; without the plugin
;      the game simply ignores the second row again.
; off  The plugin loads and changes nothing.
Mode = six
