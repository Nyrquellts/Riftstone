; free_sprint settings. Keep this file next to free_sprint.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\free_sprint.log shows what it did.
[sprint]
; out_of_battle  Sprinting costs no stamina while the game is not in battle (the state that starts
;                the battle music). In battle it costs what it always did.
; always         Sprinting never costs stamina.
; off            The plugin loads and changes nothing.
; A jump from a sprint, climbing a monster and carrying still cost stamina.
Mode = out_of_battle
; party   You and your pawns.
; arisen  Only you.
Who = party
