; save_backup settings. Keep this file next to save_backup.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\save_backup.log shows what it did.
; List and restore the copies with:  riftstone saves list  /  riftstone saves restore <number> --yes
[backup]
; 1 = on. 0 = the plugin loads and copies nothing.
Enabled = 1

; How many of the newest saves to keep (each copy is 512 KB).
Keep = 20

; Also keep the save each of this many game sessions started from, however old, so one bad
; session can always be undone. 0 = only the newest Keep copies.
KeepSessions = 10

; Where the copies go, one folder per Steam account. auto = %LOCALAPPDATA%\Riftstone\saves.
; Keep it out of Steam's userdata folder so Steam Cloud never syncs the copies.
Folder = auto

; The save to watch. auto = every Steam account's userdata\<account>\367500\remote\DDDA.sav.
SaveFile = auto

; How often to look at the save, in seconds.
CheckSeconds = 2
