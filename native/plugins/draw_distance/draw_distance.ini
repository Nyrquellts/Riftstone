; draw_distance settings. Keep this file next to draw_distance.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\draw_distance.log shows what it did.
; The game multiplies the distances below by its View Range option (config.ini ViewRange):
; NORMAL 1, FAR 2, FARTHEST 3. A number here replaces that multiplier at every View Range, so these
; work with FAR or NORMAL too (the pairing lod_tuner recommends). 0 = leave it to the game.
[draw]
; 1 = on. 0 = the plugin loads and changes nothing.
Enabled = 1

; Objects in the overworld (props, doors, chests, gathering spots and the like) are drawn and updated
; only within their display radius of you: 25 m for small ones (15 m for some), 1 km for large ones,
; times this. 3 is what FARTHEST does. 1 to 20. Higher shows small objects farther away and costs
; drawing time.
Objects = 3

; Grass fades out between 17 and 70 m, times this. 1 to 3 (3 is what FARTHEST does; the game never
; draws grass farther, so more is not offered).
Grass = 3

; Monsters stay fully active (thinking, physics) within their kind's distance, 20 to 300 m times
; this, keep moving up to 200 m beyond it and stand frozen farther out. The game draws them either
; way. 1 to 20. Higher costs CPU for their AI.
Enemies = 0

; Human enemies (bandits and the like) stay fully active within this many metres (the game: 100 at
; every View Range), keep moving and showing up to 200 m beyond it, and vanish farther out.
; 100 to 2000.
HumanEnemies = 0

; 1 = objects in the overworld are never hidden or stopped by distance, only by what the game has
; loaded around you. Costs drawing time.
ObjectsNeverHide = 0

; 1 = monsters and human enemies stay fully active (and human enemies shown) at any distance, as
; long as the game has them loaded. Costs CPU for their AI.
EnemiesAlwaysActive = 0
