[stage_enemies]
; stage_enemies -- load an enemy's archive when a stage loads, so a mod can put that enemy in a stage the game never uses it in
; (the group lists reference the enemy; the stage just has to load its model). This plugin does nothing until
; you list a stage below. Installing mods with Riftstone writes the lines they need, between its own marked
; comment lines (keep your own lines outside them); you can add lines yourself too.
;
; One line per stage: the stage number, "=", then one or more enemies -- emNNNN (em5301 is the Archydra,
; em5300 the Hydra, em5200 Chimeras, em5900 Drakes, em0900 Ogres, em5902 Wyverns) or raw archive-tag numbers --
; separated by commas. At most 16 enemies a stage and 64 in all: past that the game's archive queue would stop
; the game with a fatal error, so the plugin skips the rest and says so in stage_enemies.log. A name listed
; twice for a stage loads once.
; All 97 vanilla enemies can load in any stage. Whether a foreign enemy then behaves in a foreign stage
; is UNKNOWN until played. 0 turns the plugin off; delete a line to stop loading that enemy there.
Enabled = 1

; Examples (remove the ; to use one): the Tower Summit (stage 370) also loads the Archydra, or the Archydra,
; Chimeras and Drakes together.
;370 = em5301
;370 = em5301, em5200, em5900
