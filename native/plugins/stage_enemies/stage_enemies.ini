[stage_enemies]
; stage_enemies -- load an enemy's archive when a stage loads, so a mod can put that enemy in a stage the game never uses it in
; (the group lists reference the enemy; the stage just has to load its model). This plugin does nothing until
; you list a stage below: it is for mod makers, and a mod that needs it says which line to add.
;
; One line per stage: the stage number, "=", then one or more enemies -- emNNNN (em5301 is the Archydra,
; em5300 the Hydra, em0900 Ogres, em5902 Wyverns) or raw archive-tag numbers -- separated by commas.
; All 97 vanilla enemies can load in any stage. Whether a foreign enemy then behaves in a foreign stage
; is UNKNOWN until played. 0 turns the plugin off; delete a line to stop loading that enemy there.
Enabled = 1

; Example (remove the ; to use it): the Tower Summit (stage 370) also loads the Archydra.
;370 = em5301
