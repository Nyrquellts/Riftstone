; lod_tuner settings. Keep this file next to lod_tuner.asi (riftstone\plugins\).
; The plugin reads it once when the game starts; riftstone\logs\lod_tuner.log shows what it used.
[lod]
; 1 = on. 0 = the plugin loads but changes nothing.
Enabled = 1

; Scenery (stage pieces and objects: rocks, trees, buildings) keeps full detail until it is about
; this many pixels tall on screen. Lower = fewer visible switches, more drawing. 0 = off (Scale only).
PopPixels = 24

; Scenery LOD distances are at least this many times vanilla. auto = screen height / 720, the
; consoles' resolution the distances were tuned for (2.0 at 1440p).
Scale = auto

; Characters, enemies, weapons and effects: multiplier on their LOD distances. 1.0 = vanilla.
; Their distances also set cloth-simulation detail, so raising this costs CPU in crowds.
Characters = 1.0

; Screen height in pixels and vertical field of view in degrees. auto = the game's config.ini
; Resolution, and 40 degrees (the engine's default camera) plus config.ini CameraFov.
ScreenHeight = auto
FieldOfView = auto

; No distance is pushed past this many metres. Vanilla distances beyond it stay as they are.
MaxDistance = 10000
