; collision_cap -- how many collision entry nodes one frame can hold.
; Every hit shape the frame's objects enter (a body part, a weapon, a shot, a wall check) takes one node of
; the game's table of 800. A frame that asks for more makes the game read past the table and crash (seen in
; Gran Soren with six Archydras: Riftstone's crash report at 0x00479C44). The plugin also stops that read at
; the table's end, whatever the number here.
; 800..16384; each node is 800 bytes, held once for the whole session. 4096 is room for about five times
; the game's own frames.
[collision_cap]
entry_nodes = 4096
