; Riftstone loader settings. Lives next to DDDA.exe (or DDO.exe). 1 = on, 0 = off.
; Riftstone keeps your values when it updates the loader; docs\runtime.md explains each one.
[loader]
; Serve archives from riftstone\overlay\ instead of nativePC\ when a mod provides them.
overlay = 1
; Write each redirected file to riftstone\logs\loader.log.
log_redirects = 1
; On a crash, write riftstone\logs\crash-<time>.txt (and a .dmp if minidump = 1).
crash_reports = 1
minidump = 1
; How many crash, fatal-error and hang reports of each kind to keep (the newest).
keep_reports = 10
; Load native plugins (*.asi, *.dll) from riftstone\plugins in name order.
plugins = 1
; Two start-up crashes in a row: start the next run without plugins and mods until they change.
; A plugin at fault in two start-up crashes is skipped until its file changes (quarantine).
safe_mode = 1
; Say so with a message box the first time safe mode starts.
safe_mode_notice = 1
; The game's fatal-error box gets one line naming Riftstone's report on it.
fatal_hint = 1
; Record what closed the game (Alt+F4, its close button, another program, Windows shutting down, its
; own exit menu) in riftstone\logs\loader.log and riftstone\runtime-state.ini. It only looks.
exit_reason = 1
; Another dinput8.dll to chain to, renamed, e.g. DDDA Tweak as dinput8_chain.dll.
chain =

[guard]
; A texture the game looks for under nativePC and cannot find gets a neutral grey stand-in, and
; loader.log names it, instead of "Fatal error: Failed open file". 0 = the game stops as it always did.
missing_textures = 1

[live]
; Share live stats with Riftstone Studio and `Riftstone.cmd live` (memory headroom, frame times,
; the loader's counters) through shared memory on this PC. Nothing is sent anywhere.
enabled = 1
; Time frames at Direct3D 9's Present.
frame_stats = 1
; No frame for hang_seconds while the game is in front: write riftstone\logs\hang-<time>.txt.
hang_reports = 1
hang_seconds = 20

[memory]
; The pressure watch: past this much commit (MB), or with the address space nearly used up, loader.log
; says what holds the memory and what would help. It flushes nothing (the game keeps no unused
; resources to flush). It eases under relief_mb. 0 = off.
pressure_mb = 3400
relief_mb = 3200

[d3d9]
; Another Direct3D 9 for the game, from a DLL inside the game folder, such as DXVK's 32-bit d3d9.dll:
; chain = riftstone\dxvk\d3d9.dll  ('Riftstone.cmd loader d3d9 add <DXVK release>' puts it there).
; Nothing goes into the game folder itself; empty = Windows' own. Off in safe mode.
chain =
; Count the textures and buffers the game holds, by Direct3D pool (needs [live] frame_stats = 1).
pool_stats = 1

[overlay]
; The in-game diagnostics panel: enemy slots in use, address space, plugins, frame rate and stage.
; 0 = the panel never draws and its key does nothing.
enabled = 1
; The key that shows and hides the panel while the game is in front: F1 to F12.
key = F10
; 1 = the panel shows from the first frame instead of waiting for the key.
show_at_start = 0
; The corner it sits in: top-right, top-left, bottom-right or bottom-left.
position = top-right
; Its size: auto (the screen's height / 1080, from 0.75 to 3) or a number such as 1.5.
scale = auto

[window]
; With the game set to windowed (config.ini FullScreen=OFF): no frame, covering the monitor.
borderless = 0
borderless_fill = 1
; Keep running when alt-tabbed (windowed or borderless only); the mouse is released meanwhile.
background_run = 0

[fps]
; Dark Arisen only. The options menu's "Variable" frame rate means this many fps instead of 150
; (30..360; 0 = leave it). Set it to your monitor's refresh rate, e.g. 165.
max_fps = 0

[render]
; Dark Arisen only. ShadowQuality=HIGH draws the sun's shadows at this size instead of 2048 (lamps
; and torches get half). 1024..8192, a multiple of 32; 0 = leave it. 4096 is sharper and costs video
; memory and some frame time.
shadow_map_size = 0

[saves]
; Dark Arisen only. Copy the save folder to %LOCALAPPDATA%\Riftstone\saves before the game reads it
; (only when it changed), keeping the newest `keep`. `Riftstone.cmd saves` lists and restores them.
backup = 1
keep = 20
